# Quickshell (caelestia): los cambios en ~/.config/quickshell/caelestia/*.qml NO cargan
# mientras siga vivo el proceso qs. `caelestia shell -d` usa la opción -n (sin duplicados)
# y termina sin hacer nada si el shell ya está en marcha.
# Reinicio recomendado tras editar QML (también tienes Ctrl+Super+Alt+R en keybinds.conf):
#   qs -c caelestia kill && sleep 0.2 && caelestia shell -d

# --- custom keybinds start ---
bind = SUPER, return, exec, foot
bind = SUPER+SHIFT, Z, exec, zed
# --- custom keybinds end ---
